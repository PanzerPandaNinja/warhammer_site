  description: Used only by spellcasters to draw on one of the Winds of Magic (Aqshy, Azyr, Hysh and so on).
- name: Charm
  characteristic: Fel
  type: basic
  short: Make people think well of you and your ideas.
  description: A successful Charm does not force anyone to obey, but they will give you fair consideration.
- name: Charm Animal
  characteristic: WP
  type: basic
  short: Befriend, calm or cow animals.
  description: Convince a wild animal to back off, or a guard dog to take the meat instead of your arm.
- name: Climb
  characteristic: S
  type: basic
  short: Scale steep or vertical surfaces.
  description: Cliffs, walls and similar. Can also matter when fighting very large monsters.
- name: Consume Alcohol
  characteristic: T
  type: basic
  short: Hold your drink without losing your wits.
  description: Resist the effects of alcohol — and impress those who admire heavy drinking.
- name: Cool
  characteristic: WP
  type: basic
  short: Stay calm under pressure and resist fear.
  description: Used to resist Charm and Intimidate, and to shrug off fear and other psychological effects.
- name: Dodge
  characteristic: Ag
  type: basic
  short: Get out of the way of danger.
  description: Duck and sidestep falling rocks, blows and other hazards. Often used to defend in combat.
- name: Drive
  characteristic: Ag
  type: basic
  short: Drive carts, coaches and other vehicles.
  description: Steer vehicles along the Empire's roads with as little trouble as possible.
- name: Endurance
  characteristic: T
  type: basic
  short: Withstand hardship, exhaustion and harsh conditions.
  description: Used to resist and recover from many Conditions, and helps you regain lost Wounds.
