# Reference data for the character sheet: classes, careers, skills and talents.
source: Warhammer Fantasy Roleplay 5th edition – classes, careers, skills and talents. Descriptions are short summaries, see
  the rulebook for the full rules.
classes:
- name: Academic
  short: Educated folk whose power comes from learning.
  description: Scholars, lawyers, physicians, engineers, priests and wizards. Academics have studied for their place in the
    world, often at a university, temple or college, and solve problems with knowledge rather than muscle.
  careers:
  - Apothecary
  - Engineer
  - Lawyer
  - Nun
  - Physician
  - Priest
  - Scholar
  - Wizard
- name: Burgher
  short: Town and city dwellers who keep urban life running.
  description: Traders, craftsfolk, townsmen, watchmen, rat catchers and the street poor. Burghers know how towns work — the
    guilds, the markets, the gossip and the back alleys.
  careers:
  - Agitator
  - Artisan
  - Beggar
  - Investigator
  - Merchant
  - Rat Catcher
  - Townsman
  - Watchman
- name: Courtier
  short: People who live in the orbit of the rich and powerful.
  description: Nobles and the advisers, envoys, spies, wardens, duellists, artists and servants around them. Courtiers deal
    in influence, etiquette and secrets.
  careers:
  - Adviser
  - Artist
  - Duellist
  - Envoy
  - Noble
  - Servant
  - Spy
  - Warden
- name: Peasant
  short: Rural folk who work the land and live close to the wild.
  description: Villagers, hunters, miners, scouts, herbalists, bailiffs, mystics and hedge witches. Peasants are hardy and
    practical, and know the countryside and its dangers.
  careers:
  - Bailiff
  - Hedge Witch
  - Herbalist
  - Hunter
  - Miner
  - Mystic
  - Scout
  - Villager
- name: Ranger
  short: Travellers who make their living on the Empire's roads.
  description: Coachmen, messengers, pedlars, entertainers, roadwardens, bounty hunters, flagellants and witch hunters. Rangers
    are always on the move and used to the perils between settlements.
  careers:
  - Bounty Hunter
  - Coachman
  - Entertainer
  - Flagellant
  - Messenger
  - Pedlar
  - Roadwarden
  - Witch Hunter
- name: Riverfolk
  short: People of the rivers, docks and seas.
  description: Boatmen, pilots, sailors, stevedores, riverwardens and riverwomen — and the smugglers and wreckers who prey
    on them. The waterways are the arteries of the Empire, and Riverfolk know them best.
  careers:
  - Boatman
  - Pilot
  - Riverwarden
  - Riverwoman
  - Sailor
  - Smuggler
  - Stevedore
  - Wrecker
- name: Rogue
  short: Those who live outside — or just beyond — the law.
  description: Thieves, charlatans, fences, knaves, racketeers, outlaws, grave robbers and unsanctioned witches. Rogues get
    by on cunning, nerve and a talent for not getting caught.
  careers:
  - Charlatan
  - Fence
  - Grave Robber
  - Knave
  - Outlaw
  - Racketeer
  - Thief
  - Witch
- name: Warrior
  short: Fighters who earn their keep with weapons.
  description: Soldiers, guards, knights, cavalry, pit fighters, hired muscle, warrior priests and dwarf slayers. Warriors
    are trained for violence and are the backbone of most adventuring parties.
  careers:
  - Cavalryman
  - Guard
  - Knight
  - Pit Fighter
  - Protagonist
  - Slayer
  - Soldier
  - Warrior Priest
careers:
- name: Adviser
  class: Courtier
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  - Wood Elf
  short: Gives counsel and guidance to a powerful patron.
  description: Advisers are trusted with secrets and political insight, serving nobles, merchants or crime lords. They rise
    from Aide to Chancellor, but a patron's fall can take them down too. Good at reading people, politics and court.
  levels:
  - name: Aide
    status: Silver 1
  - name: Adviser
    status: Silver 3
  - name: Counsellor
    status: Silver 5
  - name: Chancellor
    status: Gold 3
- name: Agitator
  class: Burgher
  species:
  - Dwarf
  - Halfling
  - Human
  short: Stirs up crowds for a political or religious cause.
  description: Agitators spread their message with pamphlets, protests and speeches, and often have to move on one step ahead
    of the authorities. Some truly believe; others exploit discontent. Strong at persuasion, city life and winning arguments.
  levels:
  - name: Pamphleteer
    status: Brass 1
  - name: Agitator
    status: Brass 2
  - name: Rabble Rouser
    status: Brass 3
  - name: Demagogue
    status: Brass 5
- name: Apothecary
  class: Academic
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  short: Mixes medicines, remedies — and poisons.
  description: Apothecaries brew pills, draughts and salves in workshops full of strange equipment. Guild rules often keep
    them out of towns, so many travel in search of customers and rare ingredients. They can heal or harm with equal skill.
  levels:
  - name: Apothecary's Apprentice
    status: Brass 3
  - name: Apothecary
    status: Silver 1
  - name: Master Apothecary
    status: Silver 3
  - name: Apothecary General
    status: Gold 1
- name: Artisan
  class: Burgher
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  - Wood Elf
  short: A skilled craftsperson who makes goods to sell.
  description: From bakers and smiths to clockmakers and shipwrights, Artisans learn their trade as apprentices and rise through
    their guild. Their skills are wanted almost everywhere, and a masterpiece can win powerful patrons.
  levels:
  - name: Apprentice Artisan
    status: Brass 2
  - name: Artisan
    status: Silver 1
  - name: Master Artisan
    status: Silver 3
  - name: Guildmaster
    status: Gold 1
- name: Artist
  class: Courtier
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  - Wood Elf
  short: Creates art — to uplift the soul or pay the bills.
  description: Painters, sculptors, writers and similar talents. A lucky few win rich patrons and acclaim; most struggle,
    taking odd jobs such as caricatures or copying better-known work. Artists often travel in search of inspiration and patronage.
  levels:
  - name: Apprentice Artist
    status: Brass 2
  - name: Artist
    status: Silver 1
  - name: Master Artist
    status: Silver 4
  - name: Maestro
    status: Gold 2
- name: Bailiff
  class: Peasant
  species:
  - Dwarf
  - Halfling
  - Human
  short: Enforces a lord's law and collects their dues.
  description: Bailiffs represent a noble on their lands, collecting taxes, settling disputes and keeping order — fairly or
    by force. They rise from Tax Collector to Magistrate, and are often sent to deal with problems beyond the estate.
  levels:
  - name: Tax Collector
    status: Silver 1
  - name: Bailiff
    status: Silver 5
  - name: Reeve
    status: Gold 1
  - name: Magistrate
    status: Gold 2
- name: Beggar
  class: Burgher
  species:
  - Dwarf
  - Halfling
  - Human
  short: Lives on the charity of others, using wit and charm.
  description: Beggars plead for alms on street corners or wander the countryside picking up scraps and odd jobs. They know
    the streets, the hidden places to sleep, and who really runs the town.
  levels:
  - name: Pauper
    status: Brass 0
  - name: Beggar
    status: Brass 1
  - name: Master Beggar
    status: Brass 4
  - name: Beggar King
    status: Silver 2
- name: Boatman
  class: Riverfolk
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  short: Carries people, goods and news along the rivers.
  description: Boatmen crew barges and ferries on the Empire's rivers and canals, from lowly Boathand to Barge Master. Tough
    and weather-beaten, they can handle rough water and rough taverns, and a boat makes a fine mobile base for a party.
  levels:
  - name: Boathand
    status: Brass 3
  - name: Boatman
    status: Silver 1
  - name: Bargeswain
    status: Silver 2
  - name: Barge Master
    status: Silver 5
- name: Bounty Hunter
  class: Ranger
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  - Wood Elf
  short: Hunts fugitives for justice, reward, or both.
  description: Bounty Hunters track down outlaws and runaways for the authorities or private clients, starting out as Thief-takers.
    Their work takes them across the Empire, and they bring a mix of tracking, social and combat skills.
  levels:
  - name: Thief-taker
    status: Silver 1
  - name: Bounty Hunter
    status: Silver 3
  - name: Master Bounty Hunter
    status: Silver 5
  - name: Bounty Hunter General
    status: Gold 1
- name: Cavalryman
  class: Warrior
  species:
  - High Elf
  - Human
  - Wood Elf
  short: A dashing light horseman, swift and versatile in war.
  description: Pistoliers, outriders, horse archers and similar mounted troops who scout, raid and harass the enemy. Cavalrymen
    have a horse, strong riding and fighting skills, and fairly high status.
  levels:
  - name: Horseman
    status: Silver 3
  - name: Cavalryman
    status: Silver 4
  - name: Cavalry Sergeant
    status: Gold 1
  - name: Cavalry Officer
    status: Gold 2
- name: Charlatan
  class: Rogue
  species:
  - Halfling
  - High Elf
  - Human
  short: A smooth-talking con artist who preys on the gullible.
  description: Charlatans win their marks' trust, then sell them something too good to be true — fake relics, miracle cures,
    worthless mines. They live by charm, quick wits and leaving town at the right moment.
  levels:
  - name: Swindler
    status: Brass 3
  - name: Charlatan
    status: Brass 5
  - name: Con Artist
    status: Silver 2
  - name: Scoundrel
    status: Silver 4
- name: Coachman
  class: Ranger
  species:
  - Dwarf
  - Halfling
  - Human
  short: Drives coaches through the dangers of the Empire's roads.
  description: Starting as Postilions riding the lead horse, Coachmen carry passengers and goods between towns, defending
    them from bandits and beastmen. Skilled with horses, vehicles and blackpowder weapons.
  levels:
  - name: Postilion
    status: Silver 1
  - name: Coachman
    status: Silver 2
  - name: Coach Master
    status: Silver 3
  - name: Route Master
    status: Gold 2
- name: Duellist
  class: Courtier
  species:
  - Dwarf
  - High Elf
  - Human
  short: Fights duels on behalf of others, bound by tradition.
  description: Duellists settle matters of honour or stand in for others in trials by combat. Some are elegant artists of
    the blade, others brutal and quick. Their reputation is their fortune, so they travel to seek challenges.
  levels:
  - name: Fencer
    status: Silver 3
  - name: Duellist
    status: Silver 4
  - name: Duelmaster
    status: Gold 1
  - name: Judicial Champion
    status: Gold 2
- name: Engineer
  class: Academic
  species:
  - Dwarf
  - Halfling
  - Human
  short: Builds machines and structures — useful, bizarre or deadly.
  description: Engineers design bridges, canals, fortifications and fantastical inventions, often trained at the Imperial
    Engineers School or a dwarf guild. They solve problems with ingenuity and, when all else fails, blackpowder.
  levels:
  - name: Student Engineer
    status: Brass 4
  - name: Engineer
    status: Silver 3
  - name: Master Engineer
    status: Silver 5
  - name: Chartered Engineer
    status: Gold 2
- name: Entertainer
  class: Ranger
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  - Wood Elf
  short: Performs for crowds, from village greens to grand theatres.
  description: Singers, actors, jesters, acrobats and stranger acts. Welcome everywhere but never quite respectable, Entertainers
    often tour the roads with a troupe, earning their keep and charming their way through doors.
  levels:
  - name: Busker
    status: Brass 3
  - name: Entertainer
    status: Brass 5
  - name: Troubadour
    status: Silver 3
  - name: Troupe Leader
    status: Gold 1
- name: Envoy
  class: Courtier
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  - Wood Elf
  short: A diplomat who negotiates pacts and treaties.
  description: Envoys represent the Empire, a noble house, a guild or a foreign power, starting as Heralds and rising to Ambassador.
    Travel and intrigue are part of the job, and one careless word can start a war.
  levels:
  - name: Herald
    status: Silver 2
  - name: Envoy
    status: Silver 4
  - name: Diplomat
    status: Gold 2
  - name: Ambassador
    status: Gold 5
- name: Fence
  class: Rogue
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  short: Buys and sells stolen goods for a tidy profit.
  description: Fences turn thieves' loot into coin, often behind a respectable front such as a pawnshop or import business.
    Shrewd judges of value, they have contacts on both sides of the law.
  levels:
  - name: Broker
    status: Brass 5
  - name: Fence
    status: Silver 1
  - name: Trafficker
    status: Silver 3
  - name: Black Marketeer
    status: Gold 1
- name: Flagellant
  class: Ranger
  species:
  - Human
  short: A fanatic who whips themselves in penance for the world's sins.
  description: Convinced that the End Times are near, Flagellants roam the Empire in bands, usually devoted to Sigmar. Most
    folk fear them. Their fearless fury in battle is matched only by how difficult they are as companions.
  levels:
  - name: Penitent
    status: Brass 0
  - name: Flagellant
    status: Brass 0
  - name: Zealot
    status: Brass 0
  - name: Prophet of Doom
    status: Brass 0
- name: Grave Robber
  class: Rogue
  species:
  - Halfling
  - Human
  short: Steals from the dead to line their own pockets.
  description: Grave Robbers dig up graves and break into tombs by night, and some sell bodies to anatomists with few questions
    asked. At the higher levels they become tomb robbers and treasure hunters.
  levels:
  - name: Penny Thief
    status: Brass 2
  - name: Grave Robber
    status: Brass 4
  - name: Tomb Robber
    status: Silver 3
  - name: Treasure Hunter
    status: Silver 5
- name: Guard
  class: Warrior
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  - Wood Elf
  short: Protects a person or place and keeps undesirables out.
  description: Guards are everywhere — at palace gates, temples, warehouses and tavern doors, or escorting caravans. Much
    of the job is standing around looking tough, which is why many leave to seek adventure.
  levels:
  - name: Sentry
    status: Brass 5
  - name: Guard
    status: Silver 2
  - name: Honour Guard
    status: Silver 4
  - name: Guard Officer
    status: Gold 1
- name: Hedge Witch
  class: Peasant
  species:
  - Human
  short: Keeps the old rural magic and guides their community.
  description: Hedge Witches live on the edge of villages, practising herb-lore, midwifery and healing, warding off evil and
    bargaining with spirits. Locals value them and keep their secret from witch hunters.
  levels:
  - name: Hedge Apprentice
    status: Brass 1
  - name: Hedge Witch
    status: Brass 4
  - name: Hedge Master
    status: Brass 5
  - name: Hedgewise
    status: Silver 2
- name: Herbalist
  class: Peasant
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  - Wood Elf
  short: Turns plants into remedies, salves and other preparations.
  description: Herbalists treat the sick and injured in places where apothecaries are too rare or expensive. They also know
    plants that can harm or intoxicate. Halflings and wood elves are especially famed for their herb-lore.
  levels:
  - name: Herb Gatherer
    status: Brass 1
  - name: Herbalist
    status: Brass 4
  - name: Herb Master
    status: Brass 5
  - name: Herbwise
    status: Silver 2
- name: Hunter
  class: Peasant
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  - Wood Elf
  short: A tough, independent hunter of wild beasts.
  description: Hunters live off fur and meat, and some turn to poaching in hard times. The best become a noble's Huntsmaster.
    Skilled at tracking, trapping, shooting and surviving in the wild.
  levels:
  - name: Trapper
    status: Brass 2
  - name: Hunter
    status: Brass 4
  - name: Tracker
    status: Silver 1
  - name: Huntsmaster
    status: Silver 4
- name: Investigator
  class: Burgher
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  short: Digs into unsolved mysteries to find the truth.
  description: Investigators look into thefts, missing persons and murders — or dig up stories and blackmail material. More
    a calling than a trade, it suits the curious and the clever; the best become famous Detectives.
  levels:
  - name: Enquirer
    status: Silver 1
  - name: Investigator
    status: Silver 2
  - name: Sleuth
    status: Silver 3
  - name: Detective
    status: Silver 5
- name: Knave
  class: Rogue
  species:
  - Halfling
  - High Elf
  - Human
  short: Guides visitors to the seedier pleasures of town.
  description: Knaves latch on to out-of-towners, promising the best taverns, gambling dens and houses of vice — and protection
    from rip-offs, for a price. Streetwise and well connected.
  levels:
  - name: Hustler
    status: Brass 2
  - name: Knave
    status: Brass 3
  - name: Procurer
    status: Silver 1
  - name: Ringleader
    status: Silver 3
- name: Knight
  class: Warrior
  species:
  - High Elf
  - Human
  - Wood Elf
  short: A heavily armoured warrior on a great warhorse.
  description: Knights belong to secular or templar orders such as the Reiksguard or Knights Panther, usually drawn from the
    nobility. A charging knight dominates the battlefield. Some are honourable champions, others arrogant bullies.
  levels:
  - name: Squire
    status: Silver 3
  - name: Knight
    status: Silver 5
  - name: First Knight
    status: Gold 2
  - name: Knight of the Inner Circle
    status: Gold 4
- name: Lawyer
  class: Academic
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  short: Navigates the Empire's tangled laws for clients.
  description: Lawyers argue cases, draft contracts and laws, and debate legal precedent in a system of contradictory codes
    where power often matters more than law. They rise from Student Lawyer to Judge.
  levels:
  - name: Student Lawyer
    status: Brass 4
  - name: Lawyer
    status: Silver 3
  - name: Barrister
    status: Gold 1
  - name: Judge
    status: Gold 2
- name: Merchant
  class: Burgher
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  short: Buys low and sells high, hoping to make a fortune.
  description: Merchants trade in goods from wool and salt to exotic spices, or in services such as banking. Merchant guilds
    rival the nobility for influence, and the richest become Merchant Princes.
  levels:
  - name: Trader
    status: Silver 2
  - name: Merchant
    status: Silver 5
  - name: Master Merchant
    status: Gold 1
  - name: Merchant Prince
    status: Gold 3
- name: Messenger
  class: Ranger
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  - Wood Elf
  short: Delivers messages and parcels quickly and reliably.
  description: Messengers carry letters for merchants, armies, criminals and anyone who needs speed and discretion. The secrets
    they carry can be worth killing for, which often starts an adventure.
  levels:
  - name: Runner
    status: Brass 3
  - name: Messenger
    status: Silver 2
  - name: Courier
    status: Silver 3
  - name: Courier-captain
    status: Silver 5
- name: Miner
  class: Peasant
  species:
  - Dwarf
  - Halfling
  - Human
  short: Toils in dark tunnels digging out ore and stone.
  description: Miners are tough, close-knit crews who know how to shore up tunnels and spot dangers from gas to goblins. Prospectors
    search for new seams above ground. Among dwarfs, mining is a respected craft.
  levels:
  - name: Prospector
    status: Brass 2
  - name: Miner
    status: Brass 3
  - name: Master Miner
    status: Brass 5
  - name: Mine Foreman
    status: Silver 3
- name: Mystic
  class: Peasant
  species:
  - High Elf
  - Human
  - Wood Elf
  short: Divines the future — or convinces people they can.
  description: Fortune tellers at carnivals, augurs in remote hermitages and cult seers all offer glimpses of what is to come.
    Some have true insight; others are clever frauds.
  levels:
  - name: Fortune Teller
    status: Brass 1
  - name: Mystic
    status: Brass 3
  - name: Augur
    status: Silver 1
  - name: Seer
    status: Silver 2
- name: Noble
  class: Courtier
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  - Wood Elf
  short: Born into privilege, set apart from the common folk.
  description: Nobles claim the right to rule through their bloodline. Some inherit land and wealth; younger children may
    have little but a name. Many seek riches or excitement through adventure.
  levels:
  - name: Scion
    status: Gold 1
  - name: Noble
    status: Gold 2
  - name: Grandee
    status: Gold 5
  - name: Noble Lord
    status: Gold 7
- name: Nun
  class: Academic
  species:
  - Human
  short: Devoted to the service of a god in a religious order.
  description: Nuns and monks live in convents and monasteries, praying and working as their deity demands — tending the sick,
    copying manuscripts or serving the Empire. Some are sent on pilgrimages or to recover relics.
  levels:
  - name: Novice
    status: Brass 1
  - name: Nun
    status: Silver 1
  - name: Abbess
    status: Gold 1
  - name: Prioress General
    status: Gold 4
- name: Outlaw
  class: Rogue
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  - Wood Elf
  short: Preys on travellers from hideouts in the wild.
  description: Outlaws rob caravans and travellers on the roads, living hard lives in camps and remote farmsteads. Some see
    themselves as common folk driven outside the law; the most ruthless become Bandit Kings.
  levels:
  - name: Brigand
    status: Brass 3
  - name: Outlaw
    status: Brass 5
  - name: Outlaw Chief
    status: Silver 3
  - name: Bandit King
    status: Gold 1
- name: Pedlar
  class: Ranger
  species:
  - Dwarf
  - Halfling
  - Human
  short: A travelling seller of cheap goods and small services.
  description: Pedlars wander from village to village selling trinkets, sharpening knives and mending pots, and carrying news
    and gossip. Always on the move, they take naturally to adventuring.
  levels:
  - name: Vagabond
    status: Brass 1
  - name: Pedlar
    status: Brass 4
  - name: Carter
    status: Silver 2
  - name: Wandering Trader
    status: Silver 3
- name: Physician
  class: Academic
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  short: Practises the art of medicine and surgery.
  description: Physicians diagnose illness, prescribe remedies and operate, though their science is young and mixed with astrology
    and folk belief. They train as apprentices or at university, and the best serve at court.
  levels:
  - name: Physician's Apprentice
    status: Brass 4
  - name: Physician
    status: Silver 3
  - name: Doktor
    status: Silver 5
  - name: Court Physician
    status: Gold 1
- name: Pilot
  class: Riverfolk
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  short: Guides vessels through treacherous waters.
  description: Pilots know the currents, sandbanks and rocks of the rivers and coasts, and are hired to bring boats through
    safely. Their local knowledge is worth every penny.
  levels:
  - name: Riverguide
    status: Brass 4
  - name: Pilot
    status: Silver 1
  - name: Navigator
    status: Silver 3
  - name: Master Pilot
    status: Silver 5
- name: Pit Fighter
  class: Warrior
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  - Wood Elf
  short: Fights for money, glory and the crowd's entertainment.
  description: Pit Fighters brawl, wrestle and duel in arenas while the crowd bets on the outcome. Victory brings coin and
    fame; defeat brings broken bones or worse.
  levels:
  - name: Pugilist
    status: Brass 4
  - name: Pit Fighter
    status: Silver 2
  - name: Pit Champion
    status: Silver 5
  - name: Pit Legend
    status: Gold 2
- name: Priest
  class: Academic
  species:
  - Human
  short: Preaches a god's word and tends to the faithful.
  description: Priests serve a temple or wander to minister wherever they are needed, embodying their god's teachings. They
    can call on their deity's blessings and, in time, miracles.
  levels:
  - name: Initiate
    status: Brass 2
  - name: Priest
    status: Silver 2
  - name: High Priest
    status: Gold 1
  - name: Lector
    status: Gold 4
- name: Protagonist
  class: Warrior
  species:
  - Dwarf
  - Halfling
  - High Elf
  - Human
  short: Muscle for hire who bullies, fights and kills for coin.
  description: Protagonists intimidate rivals, scare off suitors and teach lessons for whoever pays. Some keep a code; others
    are simply thugs. The most capable become hitmen and assassins.
  levels:
  - name: Braggart
    status: Brass 3
