qualities:
- name: Blackpowder
  kind: weapon quality
  description: Anyone shot at must pass an Average (+2 SL) Psychology Test or become Broken, even if it misses.
- name: Blast
  kind: weapon quality
  description: Hits everyone in a circle Rating yards across; usually cannot be opposed. Deals Weapon Damage but not SL Damage.
- name: Damaging
  kind: weapon quality
  description: Use the higher of the SL or the units die for Damage.
- name: Defensive
  kind: weapon quality
  description: +1 SL to Melee Tests to oppose an attack.
- name: Fast
  kind: weapon quality
  description: +2 Combat Initiative for attacks with it (lost when fighting with two weapons).
- name: Hack
  kind: weapon quality
  description: A hit damages the struck armour or shield by 1 point before Damage is applied.
- name: Impale
  kind: weapon quality
  description: Critical Hits also on rolls divisible by 10. Lodged arrows and bolts need a Heal Test to remove, bullets a
    surgeon.
- name: Inflict
  kind: weapon quality
  description: A hit gives the target the listed Condition.
- name: Magical
  kind: weapon quality
  description: Can harm creatures immune to ordinary weapons.
- name: Parry
  kind: weapon quality
  description: No off-hand penalty when defending. When dual wielding, a second attack after a hit is unopposed.
- name: Penetrating
  kind: weapon quality
  description: Ignores 2 Armour Points.
- name: Pistol
  kind: weapon quality
  description: Can attack in melee, without range modifiers.
- name: Precise
  kind: weapon quality
  description: +1 SL to successful attack Tests.
- name: Pummel
  kind: weapon quality
  description: A head hit dealing Wounds at least equal to the target's Toughness Bonus Stuns them.
- name: Repeater
  kind: weapon quality
  description: Holds Rating shots; shoot twice at one target at −1 SL as one Action.
- name: Trap Blade
  kind: weapon quality
  description: On a Critical while defending against a blade, trap it instead — the opponent drops it, and you may try to
    break it.
- name: Unbreakable
  kind: weapon quality
  description: Will not break, corrode or lose its edge.
- name: Wrap
  kind: weapon quality
  description: Opponents suffer −1 SL when parrying it.
- name: Dangerous
  kind: weapon flaw
  description: A failed Test with a 9 on either die is a Fumble.
- name: Imprecise
  kind: weapon flaw
  description: −1 SL to attack with it.
- name: Reload
  kind: weapon flaw
  description: After firing, spend Rating Actions reloading before it can be used again.
- name: Unbalanced
  kind: weapon flaw
  description: −1 SL when defending with it.
- name: Undamaging
  kind: weapon flaw
  description: Armour Points count double against it, it need not cause a Wound, and Critical Wounds are rolled twice taking
    the lower.
- name: Flexible
  kind: armour quality
  description: Can be worn under non-Flexible armour, giving the benefit of both.
- name: Impenetrable
  kind: armour quality
  description: Critical Hits from odd-numbered rolls (11, 33…) are ignored.
- name: Shield
  kind: armour quality
  description: +1 SL when opposing with Dodge or Melee, and its AP count if you are hit. With 2+ AP you can Dodge ranged attacks.
- name: Partial
  kind: armour flaw
  description: Hits with an even Hit Location number ignore its AP.
- name: Weakpoints
  kind: armour flaw
  description: A Critical Hit from an Impale weapon ignores its AP.
lores:
- name: Petty Spells
  kind: magic
  description: Simple cantrips (CN 0) learned with the Petty Magic talent.
- name: Arcane Spells
  kind: magic
  description: Extra spells available to every Lore of Magic, flavoured by the caster's lore.
- name: Lore of Beasts
  kind: magic
  description: Ghur, the Amber Wind — primal, savage magic of animals.
- name: Lore of Death
  kind: magic
  description: Shyish, the Purple Wind — magic of endings, souls and the undead.
- name: Lore of Fire
  kind: magic
  description: Aqshy, the Bright Wind — passionate, destructive flame.
- name: Lore of Heavens
  kind: magic
  description: Azyr, the Celestial Wind — storms, stars, fate and fortune.
- name: Lore of Life
  kind: magic
  description: Ghyran, the Jade Wind — growth, healing and the land.
- name: Lore of Light
  kind: magic
  description: Hysh, the White Wind — illumination, banishment and clarity.
- name: Lore of Metal
  kind: magic
  description: Chamon, the Golden Wind — metal, transmutation and alchemy.
- name: Lore of Shadows
  kind: magic
  description: Ulgu, the Grey Wind — illusion, deception and concealment.
- name: Lore of Hedgecraft
  kind: magic
  description: 'Witch magic of the Hedgefolk: charms, remedies and the spirit world.'
- name: Lore of Witchcraft
  kind: magic
  description: Witch magic of curses, hexes and blight.
- name: Lore of Daemonology
  kind: magic
  description: Dark magic for summoning, binding and banishing daemons.
- name: Lore of Necromancy
  kind: magic
  description: Dark magic for raising and commanding the dead.
- name: Lore of Nurgle
  kind: magic
  description: Chaos magic of disease and decay.
- name: Lore of Slaanesh
  kind: magic
  description: Chaos magic of sensation, excess and seduction.
- name: Lore of Tzeentch
  kind: magic
  description: Chaos magic of change, deceit and mutation.
