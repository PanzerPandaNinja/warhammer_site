talents:
- name: Accurate Shot
  short: Ranged hits deal extra Damage.
  description: Successful ranged attacks deal +1 Damage, or +2 if you took time to aim.
- name: Acute Sense
  examples:
  - Hearing
  - Sight
  - Taste
  - Touch
  short: One sense is unusually sharp.
  description: You can make Perception Tests to notice things others could not detect with that sense. Can be taken again
    for another sense.
- name: Aethyric Attunement
  short: Better control of magic; safer miscasts.
  description: When you must roll on the Minor Miscast table after a successful Casting or Channelling Test, roll twice and
    pick. Take it again to do the same for Major Miscasts.
- name: Alley Cat
  short: At home in towns and cities.
  description: Advantage on Stealth (Urban) Tests, and you know the quickest or quietest way across a town you are familiar
    with.
- name: Ambidextrous
  short: Equally skilled with either hand.
  description: You ignore the penalty for using your off hand, including for attacks.
- name: Animal Affinity
  short: Wild animals are at ease around you.
  description: As long as you are not aggressive, wild animals will not normally attack you.
- name: Arcane Magic
  examples:
  - Heavens
  - Hedgecraft
  - Witchcraft
  short: Learn spells from a Lore of Magic.
  description: Choose one Colour Lore, a witch lore or a dark lore. You gain one spell from it and can learn more with XP.
- name: Argumentative
  short: Draws people into pointless arguments.
  description: Others must beat your Charm with Cool to escape the debate, and are distracted while arguing.
- name: Artistic
  short: A natural talent for one form of art.
  description: You can always advance Art and gain Advantage on Art Tests in your chosen medium. Can be taken again for another
    medium.
- name: Attractive
  short: Knows how to use their looks.
  description: When successfully charming someone attracted to you, you may use the units die instead of your SL.
- name: Battle Rage
  short: Always on the edge of a violent frenzy.
  description: Enter Frenzy without a Test when another ability allows it, and you are not Fatigued when it ends.
- name: Beat Blade
  short: Strikes the enemy's weapon to open their guard.
  description: Give up Damage on a hit to stop the enemy defending with Melee and give attacks against them Advantage until
    your next Turn.
- name: Beneath Notice
  short: Fades into the background among their betters.
  description: Properly dressed and behaving, most people assume you belong wherever you are.
- name: Berserk Charge
  short: Charges with reckless force.
  description: Add +2 Damage when you Charge.
- name: Blather
  short: Talks their way out of being caught.
  description: When caught, an Opposed Charm vs Cool Test makes your excuse believed for a while.
- name: Bless
  short: Can call on a god's blessings.
  description: You gain all the Blessings of your deity. Cannot be combined with arcane magic talents or Channelling.
- name: Bookish
  short: An avid reader at home in libraries.
  description: Advantage on Research Tests.
- name: Break and Enter
  short: Finds the best way into any building.
  description: You can spot the fastest, quietest way in, and gain Advantage on Pick Lock Tests and Strength Tests to force
    doors or windows.
- name: Briber
  short: Knows who can be bought, and for how much.
  description: Advantage on Bribery Tests.
- name: Cardsharp
  short: Wins at games — not always fairly.
  description: On a double in an Opposed Gamble Test you may make your opponent reroll, cancelling any Sleight of Hand advantage
    they had.
- name: Careful Strike
  short: Hits exactly where they aim in melee.
  description: Called Shots in melee have a smaller penalty, or none if you have Advantage.
- name: Carouser
  short: A seasoned drinker.
  description: No ill effects from moderate drinking, and Advantage on Consume Alcohol Tests and Endurance Tests against poison.
- name: Cat-tongued
  short: Lies as easily as telling the truth.
  description: Advantage on Charm Tests to lie convincingly.
- name: Catfall
  short: Lands like a cat.
  description: Every fall counts as deliberate, so you can test Athletics to reduce Damage, with Advantage.
- name: Chaos Magic
  short: Wields the forbidden magic of a Dark God.
  description: Gain spells from a Chaos Lore, gaining Corruption with each spell learned. Can never be unlearned.
- name: Combat Aware
  short: Reads the battlefield quickly.
  description: Test Perception to avoid being Surprised; succeed automatically where the GM would allow a Test.
- name: Combat Master
  short: Fights like two people.
  description: You count as two people when working out who is outnumbered.
- name: Combat Reflexes
  short: Reacts instantly when a fight starts.
  description: Roll Combat Initiative twice and keep the better result.
- name: Commanding Presence
  short: A presence that turns the tide of battle.
  description: When you succeed with Leadership in combat, you may use the units die instead of your SL.
- name: Concoct
  short: Brews potions on the go.
  description: Once per session, make an apothecary, herbalist or poisoner item without a workshop; it spoils at the next
    Downtime.
- name: Contortionist
  short: Bends the body in unnatural ways.
  description: Squeeze through tiny gaps, and gain Advantage on Athletics Tests to escape bonds.
- name: Coolheaded
  short: Calm and strong-willed.
  description: +5 Willpower (does not count as Advances).
- name: Crack the Whip
  short: Gets the most out of draught animals.
  description: With Drive, your animals can act and move without a Test, Drive Tests have Advantage, and your team is faster
    in a Pursuit.
- name: Craftsman
  examples:
  - Apothecary
  - Barber
  - Boatbuilder
  - Cartographer
  - Engineer
  - Explosives
  - Herbalist
  short: A true master of a craft.
  description: Advantage on Tests with your chosen Trade, which you may advance even outside your Career. Can be taken again
    for another Trade.
- name: Criminal
  short: An active, recognisable criminal.
  description: Double coin from criminal Income. Law enforcers distrust you, and you can only enter Careers that include this
    Talent.
- name: Deadeye Shot
  short: Shoots exactly where they aim.
  description: Ranged Called Shots have a smaller penalty, or none when aiming.
- name: Dealmaker
  short: Knows how to close a deal.
  description: Advantage on Haggle Tests, and you can tell when an offer is really final.
- name: Detect Artefact
  short: Senses magic in objects.
  description: Touch tells you if an item is magical. With Second Sight you can test Intuition to learn its powers.
- name: Dicer
  short: Lucky and skilled at games of chance.
  description: Advantage on Gamble Tests.
- name: Dirty Fighting
  short: Knows every dirty trick in a brawl.
  description: An unarmed Called Shot to the body that wounds can inflict a low-blow Critical Wound instead of normal Damage.
- name: Disarm
  short: Knocks weapons out of opponents' hands.
  description: On a strong melee hit you may give up Damage to send the opponent's weapon flying.
- name: Distract
  short: Startles opponents with feints and gestures.
  description: Use your Move for an Opposed Test; if you win, the target loses Momentum and Advantage until your next Turn.
- name: Doomed
  short: A priest of Morr foretold your death.
  description: Agree a Doom with the GM. If you die as foretold, allies refresh Fortune and your next character gains a Fate
    Point.
- name: Drilled
  short: Trained to fight in formation.
  description: Allies can freely Disengage from enemies you are also fighting, and you can share Momentum with drilled comrades
    beside you.
- name: Dual Wielder
  short: Fights with a weapon in each hand.
  description: Make the free off-hand attack without spending Momentum (you still need it), and daggers gain the Parry quality.
- name: Embezzle
  short: Skims money from employers.
  description: 'Use Bribery or Evaluate to earn: success doubles your money, failure earns nothing.'
- name: Enclosed Fighter
  short: Fights well in tight spaces.
  description: Ignore penalties for cramped spaces and use Dodge even where there is no room.
- name: Etiquette
  examples:
  - Criminals
  - Cultists
  - Guilders
  - Nobles
  - Scholars
  - Servants
  - Soldiers
  short: Fits in with a particular social group.
  description: Blend in with the chosen group (such as Nobles, Soldiers or Criminals) when dressed and behaving appropriately.
- name: Fast Hands
  short: Quick, dexterous hands.
  description: Advantage on Sleight of Hand Tests and on brawling Tests to touch an opponent.
- name: Fast Shot
  short: Draws and fires a pistol in a flash.
  description: If not Engaged, make one pistol attack before the first Turn of the Round.
- name: Fearless
  examples:
  - Beasts
  - Bounties
  - Criminals
  - Everything
  - Intruders
  - Merchants
  - Outlaws
  - Paupers
  - Rats
  - Riverwardens
  - Roadwardens
  - Undead
  - Watchmen
  - Witches
  - Wreckers
  short: Unafraid of a particular kind of enemy.
  description: Immune to Fear from the chosen group. Can be taken again for another group.
- name: Feint
  short: Uses false attacks to fool opponents.
  description: If you have Momentum and they do not, force the opponent to defend with Intuition.
- name: Field Dressing
  short: Patches up wounds with whatever is at hand.
  description: Advantage on Heal Tests, and you can make splints and bandages from ordinary materials.
- name: Fisherman
  short: Can always catch a meal.
  description: With water and gear you catch enough fish for yourself plus others equal to your Initiative Bonus.
- name: Flagellant
  short: Pain only spurs them on.
  description: Ignore penalties from Critical Wounds (except amputations), and can Frenzy whenever wounded.
- name: Flee!
  short: Runs remarkably fast when life is at stake.
  description: Sprint away after Disengaging, avoid Broken when fleeing, and gain +1 SL as the quarry in a Pursuit.
- name: Fleet-footed
  short: Unusually fast on their feet.
  description: +1 Movement.
- name: Frenzy
  short: Can unleash a battle fury.
  description: 'A Willpower Test lets you Frenzy: extra attacks, more Damage and immunity to most psychology.'
- name: Frightening
  short: Strikes fear into enemies.
  description: You gain the Fear trait (1, or 2 if Large). Enemies who have not overcome it cannot gain Momentum against you.
- name: Furious Assault
  short: Rains down blow after blow.
  description: Once per Round, after a melee hit, lose Momentum to make an extra attack.
- name: Gregarious
  short: Loves talking to people, and they to them.
  description: Advantage on Gossip Tests, and you know where gossip is exchanged.
- name: Gunner
  short: Handles blackpowder weapons safely.
  description: Ignore the Dangerous flaw on blackpowder, engineering and explosive weapons.
- name: Hardy
  short: Tougher than most.
  description: Add your Toughness Bonus to your Wounds a second time.
- name: Hatred
  examples:
  - Heretics
  - Outlaws
  short: Consumed by hatred for a group.
  description: 'Gain Hatred for the group: +1 SL to attacks against them and immunity to their Intimidate and Fear, but you
    may be compelled to attack.'
- name: Holy Hatred
  short: Prayers burn with hatred for the enemy.
  description: Miracles that cause Wounds deal +2 Wounds.
- name: Holy Visions
  short: Sees the works of the gods.
  description: Sense holy ground, perceive Blessings, Miracles and Chaos spells cast nearby, and feel divine power in objects.
- name: Hunter's Eye
  short: Always finds game.
  description: In well-stocked lands you hunt enough food for yourself plus others equal to your Initiative Bonus.
- name: Impassioned Zeal
  short: Burns with belief in a cause.
  description: Advantage on Charm when speaking about your cause, but Disadvantage when lying about or denouncing it.
- name: Implacable
  short: Hard to finish off.
  description: Gain one fewer Bleeding Condition whenever you would gain them.
- name: In-fighter
  short: Gets inside an opponent's reach.
  description: Longer weapons give no bonus against you, and you can force in-fighting where long weapons become improvised.
- name: Inspiring
  short: Others naturally follow your lead.
  description: People look to you in a crisis, and you gain Advantage on Leadership Tests.
- name: Instinctive Diction
  short: Speaks Magick swiftly and precisely.
  description: After a successful cast, reduce Minor Miscast rolls by 20, possibly avoiding them altogether.
- name: Invoke
  short: Can call on a god's miracles.
  description: Gain one Miracle of your god and learn more with XP. Cannot be combined with arcane magic talents or Channelling.
- name: Iron Jaw
  short: Shrugs off heavy blows.
  description: The first time in an encounter you would be Stunned, gain one fewer Stunned Condition.
- name: Iron Will
  short: Will not bow to anyone.
  description: Advantage on Cool Tests to resist influence, mundane or magical.
- name: Jump Up
  short: Springs back up when knocked down.
  description: When Prone you can test Athletics or Perform (Acrobatics) to get up at once; Advantage on acrobatics outside
    combat.
- name: Kingpin
  short: A respected criminal.
  description: The Criminal talent no longer draws suspicion or limits your Careers, and most criminals respect you.
- name: Lightning Reflexes
  short: Exceptionally quick.
  description: +5 Agility (does not count as Advances).
- name: Linguistics
  short: Picks up languages with ease.
  description: Advantage on Language Tests, and Language Advances always cost 50 XP (not Magick).
- name: Lip Reading
  short: Understands speech by watching lips.
  description: With a clear view of the speaker, test Intuition to follow what they say.
- name: Luck
  short: Blessed by Ranald.
  description: +1 maximum Fortune. Can be taken up to three times.
- name: Magic Resistance
  short: Magic struggles to affect them.
  description: Spells affecting you lose 3 SL. You can never learn magic or priestly talents, or Channelling.
- name: Magical Sense
  short: Feels the Winds of Magic stir.
  description: You notice spellcasting nearby and its rough direction, and gain Advantage reading the Winds if you can see
    them.
- name: Magnum Opus
  short: Creates a true masterpiece.
  description: Make one extraordinary work of art or craft that impresses everyone and sells for at least ten times its value.
    Can be taken again.
- name: Marksman
  short: A naturally good shot.
  description: +5 Ballistic Skill (does not count as Advances).
- name: Master of Disguise
  short: Becomes someone else entirely.
  description: Change your appearance with posture, expression and clothing; on successful acting use the units die instead
    of SL.
- name: Master Orator
  short: Speaks clearly and convincingly on any topic.
  description: Advantage on Lore Tests to argue a case or a point before a court or crowd.
- name: Master Tradesman
  examples:
  - Apothecary
  - Boatbuilder
  - Engineer
  - Herbalist
  short: A skilled and reliable artisan.
  description: With your chosen Trade, use the units die instead of SL on success. Can be taken again for another Trade.
- name: Menacing
  short: People steer clear of you.
  description: Advantage on Intimidate Tests, and thieves and bandits usually pick another target.
- name: Mimic
  short: Copies accents and voices.
  description: Advantage on Entertain (Acting, Comedy) and Perform (Clowning), and you can pick up any accent you hear for
    a day.
- name: Night Vision
  short: Sees well in the dark.
  description: With even faint light you see clearly for 20 yards, and light sources reach 20 yards further.
- name: Nimble-fingered
  short: Unusually dexterous.
  description: +5 Dexterity (does not count as Advances).
- name: Noble Blood
  short: Of noble birth.
  description: Count as at least one Status tier higher than commoners, and can enter the Noble Career as if in your own Class.
- name: Nose for Trouble
  short: Has a knack for finding — and escaping — trouble.
  description: Advantage on Intuition Tests about danger, and you know where to find gambling, fights or drink.
- name: Numismatics
  short: Expert on coins and artefacts.
  description: Advantage on Lore (Heraldry) to identify coins, medals and flags; use the units die on successful Evaluate
    Tests.
- name: Old Salt
  short: An experienced seafarer.
  description: Use the units die on successful Row or Sail Tests at sea, and count as two crew.
- name: Orientation
  short: An instinctive sense of direction.
  description: Advantage on Navigation Tests, and you always know which way is north.
- name: Panhandle
  short: A skilled beggar.
  description: Advantage on Charm when begging, and you know where to find shelter in town.
- name: Perfect Pitch
  short: Perfect musical ear.
  description: Learn music after one hearing; Advantage on Entertain (Singing) and Play Tests.
- name: Petty Magic
  short: Has the spark of magic.
  description: Gain three petty spells of your choice, and learn more with XP.
- name: Pharmacist
  short: Expert at making medicines.
  description: Make one extra dose when creating a remedy.
- name: Pilot
  short: Steers vessels through danger.
  description: Advantage on Row and Sail Tests.
- name: Public Speaker
  short: Rouses crowds of common folk.
  description: Advantage on Charm to sway groups, after which you can use Leadership on them.
- name: Pure Soul
  short: Resists the taint of Chaos.
  description: You can hold twice as many Corruption Points before testing for mutation.
- name: Rapid Reload
  short: Reloads with practised speed.
  description: Reduce the Reload flaw of your ranged weapons by 1.
- name: Reaction Strike
  short: Strikes at chargers.
  description: When Charged, test Initiative for a free attack against the charger (once per Round).
- name: Read/Write
  short: Can read and write.
  description: You can read and write every language you speak.
- name: Relentless
  short: Hard to escape.
  description: When an opponent Disengages you can test to chase them, and gain +1 SL as pursuer in a Pursuit.
- name: Resistant
  examples:
  - Disease
  - Poison
  short: Resists a particular threat.
  description: Once per session automatically pass a Test against the chosen threat (disease, poison, magic…), with Advantage
    on later Tests.
- name: Resolute
  short: Grimly determined in danger.
  description: When you gain a Condition, a Cool Test lets you keep your Momentum.
- name: Reversal
  short: Finds an edge in desperate fights.
  description: Keep your Momentum when you are hit despite succeeding on your Test.
- name: Riposte
  short: Counter-attacks when defending.
  description: Once per Round, when you win an Opposed Test as defender, deal Damage as if you were the attacker.
- name: River Guide
  short: Knows the tricks of dangerous rivers.
  description: Only test to navigate the hardest waters; with the right Lore (Local) you never need to.
- name: Robust
  short: Recovers quickly from injury.
  description: Heal 2 extra Wounds whenever you test to heal.
- name: Roughrider
  short: At home in the saddle.
  description: With Ride your mount can act and move without a Test, Ride Tests have Advantage, and it is faster in a Pursuit.
- name: Rover
  short: Moves quickly and quietly through the wilds.
  description: Advantage on Stealth (Rural), and you can find the easiest route, game, water and shelter.
- name: Savant
  examples:
  - Art
  - Chemistry
  - Engineering
  - Folklore
  - Herbs
  - Law
  - Local
  - Medicine
  - Politics
  - Riverways
  - Theology
  short: Deeply learned in one field.
  description: Advantage on Tests with your chosen Lore. Can be taken again for another Lore.
- name: Savvy
  short: Sharp-witted.
  description: +5 Intelligence (does not count as Advances).
- name: Scale Sheer Surface
  short: An exceptional climber.
  description: Advantage on Climb Tests, and you can attempt near-impossible surfaces.
- name: Schemer
  short: A master of politics and rumour.
  description: On successful Gossip or Lore (Politics) Tests, use the units die instead of SL.
- name: Sea Legs
  short: Never seasick.
  description: No Tests for seasickness in normal conditions, and Advantage when one is required.
- name: Seasoned Traveller
  short: Picks up local knowledge quickly.
  description: Always able to advance the Lore (Local) of the region you are in.
- name: Second Sight
  short: Sees the Winds of Magic.
  description: You can perceive the Winds of Magic.
- name: Secret Identity
  short: Keeps a convincing second identity.
  description: Pose as another Career, with its Class and Status, without testing to keep up the act.
- name: Shadow
  short: Follows people unseen.
  description: Tail someone through crowds; if spotted, choose to be seen or to lose them while staying hidden.
- name: Sharp
  short: Quick to notice and react.
  description: +5 Initiative (does not count as Advances).
- name: Sharpshooter
  short: Makes incredibly accurate shots.
  description: No penalties for Prone or covered targets, and you can attempt trick shots others think impossible.
- name: Shieldsman
  short: Controls a fight with a shield.
  description: Lose Momentum to share your shield's AP with an ally, or push an opponent back 2 yards when you win a melee
    Test.
- name: Sixth Sense
  short: Feels when danger is near.
  description: Before springing a trap or ambush, test Intuition to notice it at the last moment.
- name: Slayer
  short: Undaunted by huge enemies.
  description: When Charged by a larger creature, you gain Momentum automatically.
- name: Sniper
  short: Hits distant targets with ease.
  description: No penalty at Long Range and only a small one at Extreme Range.
- name: Speedreader
  short: Reads at an incredible pace.
  description: Read a whole book in a day; double the SL from successful Extended Research Tests.
- name: Sprinter
  short: A fast runner.
  description: Advantage on Athletics Tests to run, and no penalty for weaving through crowds.
- name: Step Aside
  short: Is never where the blow lands.
  description: After a successful Dodge, move 2 yards away and stop being Engaged, without a free attack.
- name: Stone Soup
  short: Gets by on very little.
  description: When the party forages you are always fed, even if the Test fails.
- name: Stout-hearted
  short: Keeps coming back for more.
  description: The first time in an encounter you would be Broken, gain one fewer Broken Condition.
- name: Striding Gait
  examples:
  - Coastal
  - Rocky
  - Wetland
  short: Crosses difficult ground with ease.
  description: Ignore movement penalties in your chosen terrain and gain +2 SL in Pursuits there. Can be taken again.
- name: Strike Mighty Blow
  short: Hits hard.
  description: +1 Damage with melee weapons, or +2 if the attack had Advantage.
- name: Strike to Injure
  short: Strikes where it hurts most.
  description: Roll twice on Critical Wound tables and choose; no Called Shot penalty for silent takedowns.
- name: Strike to Stun
  short: Knows how to knock out rather than kill.
  description: Improvised weapons count as Pummel, and Advantage on silent takedowns.
- name: Strong Back
  short: Used to hard work and heavy loads.
  description: +1 SL on Opposed Strength Tests and +1 Encumbrance. Take again for +3 SL and +3 Encumbrance.
- name: Strong Legs
  short: Jumps far.
  description: Advantage on Athletics Tests to jump, and deliberate falls count as 1 yard shorter.
- name: Strong Swimmer
  short: An accomplished swimmer.
  description: Advantage on Swim Tests and +2 SL in swimming Pursuits.
- name: Strong-minded
  short: Determined and resolute.
  description: Once per session, take a Test ignoring all negative modifiers.
- name: Sturdy
  short: Brawny and used to carrying things.
  description: Count your Strength Bonus twice when working out your Encumbrance limit.
- name: Suave
  short: Smooth and charming.
  description: +5 Fellowship (does not count as Advances).
- name: Super Numerate
  short: A gift for calculation.
  description: Advantage on Evaluate Tests, and you always know how much time has passed.
- name: Supportive
  short: Knows how to please superiors.
  description: Ignore the penalty for charming higher Status, and gain Advantage when ingratiating yourself with them.
- name: Sure Shot
  short: Finds the gaps in armour.
  description: Ranged attacks deal +1 Damage and ignore Partial armour (and Weakpoints with Impale weapons).
- name: Surgery
  short: A trained surgeon.
  description: Use the units die on successful Heal Tests outside combat, and treat Critical Wounds that need surgery.
- name: Tenacious
  short: Vigorous and hard to tire.
  description: The first time in an encounter you would be Fatigued, gain one fewer Fatigued Condition.
- name: Tinker
  short: Can repair almost anything.
  description: Trade Skills count as Basic for repairs; with a Trade Advance, repairs have Advantage and take half the time.
- name: Tower of Memories
  short: Perfect recall through a mental technique.
  description: On successful Lore Tests, use the units die instead of SL.
- name: Trapper
  short: Skilled with traps and snares.
  description: Advantage on Set Trap Tests, and you can build a small trap or covered pit in an hour.
- name: Trick Rider
  short: Performs amazing feats in the saddle.
  description: Use Perform Skills and your full Dodge while mounted.
- name: Tunnel Fighter
  short: At home underground.
  description: Advantage on Stealth (Underground), and you know how far and how deep you have gone.
- name: Unshakeable
  short: A veteran of gunfire.
  description: No Test to resist being Broken when shot at by blackpowder weapons.
- name: Very Resilient
  short: Unusually tough.
  description: +5 Toughness (does not count as Advances).
- name: Very Strong
  short: Unusually strong.
  description: +5 Strength (does not count as Advances).
- name: War Leader
  short: Keeps soldiers fighting to the end.
  description: Allies you lead in battle may use your Leadership instead of their Cool to resist Fear.
- name: War Wizard
  short: Casts spells in the thick of battle.
  description: As a Free Action, lose Momentum to cast a spell of CN 5 or less.
- name: Warrior Born
  short: A natural fighter.
  description: +5 Weapon Skill (does not count as Advances).
- name: Waterman
  short: An experienced river sailor.
  description: Use the units die on successful Row or Sail Tests on rivers and lakes, and count as two crew.
- name: Wealthy
  short: Rarely short of coin.
  description: Earn 1 extra gold crown when earning money; take it again for 3.
- name: Well-prepared
  short: Always has the right thing in their pocket.
  description: Once per session (more with Fortune), produce a small, cheap item you could have bought earlier, paying its
    cost.
- name: Witch!
  short: Learned magic by trial and error.
  description: Gain one spell from a Colour Lore or Witchcraft, treating its Channelling and Language (Magick) as Basic. Draws
    witch hunters' attention.
